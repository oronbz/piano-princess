<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f472b6"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
    <linearGradient id="crown" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fde68a"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>
  <!-- Piano keys (simplified) -->
  <g transform="translate(106, 260)">
    <!-- White keys -->
    <rect x="0" y="0" width="42" height="120" rx="6" fill="white" stroke="#e5e7eb" stroke-width="1.5"/>
    <rect x="44" y="0" width="42" height="120" rx="6" fill="white" stroke="#e5e7eb" stroke-width="1.5"/>
    <rect x="88" y="0" width="42" height="120" rx="6" fill="white" stroke="#e5e7eb" stroke-width="1.5"/>
    <rect x="132" y="0" width="42" height="120" rx="6" fill="white" stroke="#e5e7eb" stroke-width="1.5"/>
    <rect x="176" y="0" width="42" height="120" rx="6" fill="white" stroke="#e5e7eb" stroke-width="1.5"/>
    <rect x="220" y="0" width="42" height="120" rx="6" fill="white" stroke="#e5e7eb" stroke-width="1.5"/>
    <rect x="264" y="0" width="42" height="120" rx="6" fill="white" stroke="#e5e7eb" stroke-width="1.5"/>
    <!-- Black keys -->
    <rect x="28" y="0" width="28" height="72" rx="4" fill="#1f2937"/>
    <rect x="72" y="0" width="28" height="72" rx="4" fill="#1f2937"/>
    <rect x="160" y="0" width="28" height="72" rx="4" fill="#1f2937"/>
    <rect x="204" y="0" width="28" height="72" rx="4" fill="#1f2937"/>
    <rect x="248" y="0" width="28" height="72" rx="4" fill="#1f2937"/>
  </g>
  <!-- Crown -->
  <g transform="translate(156, 80)">
    <polygon points="100,120 0,120 15,50 40,80 60,10 80,80 100,50 120,80 140,10 160,80 185,50 200,120" fill="url(#crown)" stroke="#d97706" stroke-width="3" stroke-linejoin="round"/>
    <!-- Crown jewels -->
    <circle cx="60" cy="32" r="8" fill="#ec4899"/>
    <circle cx="100" cy="12" r="8" fill="#ec4899"/>
    <circle cx="140" cy="32" r="8" fill="#ec4899"/>
    <!-- Crown base -->
    <rect x="0" y="115" width="200" height="20" rx="6" fill="url(#crown)" stroke="#d97706" stroke-width="3"/>
  </g>
  <!-- Sparkles -->
  <g fill="#fde68a" opacity="0.9">
    <polygon points="80,180 85,170 90,180 85,190" />
    <polygon points="420,200 425,190 430,200 425,210" />
    <polygon points="100,400 105,390 110,400 105,410" />
    <polygon points="400,340 405,330 410,340 405,350" />
  </g>
</svg>
